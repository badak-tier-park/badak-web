name: PR 자동 설정

# PR을 열면 담당자·리뷰어·라벨·관련 이슈(Development)·프로젝트를 자동으로 채운다.
# 사람이 매번 손으로 고르면 빠뜨린다 — 실제로 PR 30개 중 이슈가 연결된 PR이 0개였다.
#
# pull_request_target: 포크·Dependabot PR에서도 쓰기 권한이 있는 토큰을 받기 위함.
# 대신 PR 코드를 체크아웃·실행하지 않는다(API 호출만). 이 원칙을 깨면 외부 PR이 비밀값을 가져갈 수 있다
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, labeled]

permissions:
  contents: write        # auto-merge 예약에 필요(GitHub API 요구사항). 코드는 체크아웃하지 않는다
  issues: write          # 담당자·라벨은 이슈 API로 붙는다
  pull-requests: write   # 리뷰어 요청, 본문 수정

concurrency:
  group: pr-setup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const action = context.payload.action
            const { owner, repo } = context.repo
            const issue_number = pr.number
            const author = pr.user.login
            const isBot = pr.user.type === 'Bot'
            const isFirstSetup = ['opened', 'reopened', 'ready_for_review'].includes(action)

            // ── 1. 담당자 = 작성자 ───────────────────────────────
            if (isFirstSetup && !isBot && !pr.assignees.some(a => a.login === author)) {
              await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [author] })
            }

            // ── 2. 리뷰어 = 작성자를 뺀 쓰기 권한자 전원 ──────────
            // Draft는 아직 리뷰 받을 상태가 아니므로 ready_for_review 때 요청한다.
            // 이미 리뷰한 사람에게 매 푸시마다 다시 요청하지 않도록 처음 한 번만
            if (isFirstSetup && !pr.draft) {
              const collaborators = await github.paginate(github.rest.repos.listCollaborators, {
                owner, repo, affiliation: 'all', per_page: 100,
              })
              const reviewers = collaborators
                .filter(c => c.type === 'User' && c.login !== author && c.permissions?.push)
                .map(c => c.login)
              if (reviewers.length) {
                await github.rest.pulls.requestReviewers({ owner, repo, pull_number: issue_number, reviewers })
              }
            }

            // ── 3. 관련 이슈(Development) ───────────────────────
            // GitHub은 본문의 Closes #n으로 PR과 이슈를 연결한다. 본문에 없고 브랜치 이름에
            // 이슈 번호가 있으면(feat/96-entry-order) 본문에 넣어 준다
            const CLOSING = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi
            let body = pr.body ?? ''
            let linked = [...body.matchAll(CLOSING)].map(m => Number(m[1]))
            const fromBranch = pr.head.ref.match(/^[a-z]+\/(\d+)(?:-|$)/)
            if (!linked.length && fromBranch) {
              const n = Number(fromBranch[1])
              try {
                await github.rest.issues.get({ owner, repo, issue_number: n })
                body = `${body.trimEnd()}\n\nCloses #${n}\n`
                await github.rest.pulls.update({ owner, repo, pull_number: issue_number, body })
                linked = [n]
              } catch {
                core.info(`브랜치의 #${n}은 이 저장소의 이슈가 아니라 연결하지 않음`)
              }
            }

            // ── 4. 라벨 ─────────────────────────────────────────
            const labels = new Set()

            // 4-1. 종류: PR 제목의 Conventional Commits 타입, 없으면 브랜치 접두사
            const TYPE_LABEL = {
              feat: 'enhancement', fix: 'bug', hotfix: 'hotfix', style: 'style',
              refactor: 'refactor', docs: 'documentation', chore: 'chore', release: 'release',
              ci: 'chore', build: 'chore', perf: 'refactor', test: 'chore',
            }
            const type = (pr.title.match(/^(\w+)(?:\([^)]*\))?!?:/) ?? pr.head.ref.match(/^(\w+)\//))?.[1]?.toLowerCase()
            if (pr.base.ref === 'main' && pr.head.ref === 'dev') labels.add('release')
            else if (type && TYPE_LABEL[type]) labels.add(TYPE_LABEL[type])

            // 4-2. 영역: 바뀐 파일 경로. 위에서부터 처음 맞는 규칙 하나
            const AREA_RULES = [
              [/^src\/(views\/(leagues|participate)\/|lib\/(leagues|leagueDetail|entries|draft|handicap|schedules|teamNames|predictions)\.ts|composables\/(useDraftDnD|useSeedSwap)\.ts|components\/(EntryRevealModal|BetModal|HpBadge))/, 'area:league'],
              [/^src\/(views\/teamBattles\/|lib\/teamBattles\.ts)/, 'area:team-battle'],
              [/^src\/(views\/tournaments\/|lib\/tournaments\.ts)/, 'area:tournament'],
              [/^(api\/liquipedia|src\/(views\/maps\/|lib\/(maps|ladderMatch|sourceLink)\.ts))/, 'area:map'],
              [/^src\/(views\/(players|dashboard|games|hof|seasons)\/|lib\/(players|games|seasons|attendance)\.ts|components\/charts\/)/, 'area:player'],
              [/^src\/(views\/auth\/|stores\/auth\.ts|router\/|lib\/supabase\.ts)/, 'area:auth'],
              [/^(src\/(styles\/|components\/|App\.|style\.css|views\/home\/)|public\/|index\.html|vite\.config)/, 'area:ui'],
              [/^(\.github\/|package(-lock)?\.json|vercel\.json|tsconfig)/, 'area:infra'],
            ]
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: issue_number, per_page: 100 })
            const areas = new Set()
            for (const f of files) {
              const hit = AREA_RULES.find(([re]) => re.test(f.filename))
              if (hit) areas.add(hit[1])
            }
            // 화면 전체를 건드리는 PR(공통 스타일 등)에 영역 라벨이 7개씩 붙으면 필터로 쓸 수 없다.
            // 4개 이상이면 파일 기준 영역은 붙이지 않고 이슈에서 물려받은 것만 쓴다
            if (areas.size <= 3) areas.forEach(a => labels.add(a))

            // 4-3. 연결된 이슈의 영역·우선순위 라벨을 물려받는다
            for (const n of linked) {
              try {
                const { data: linkedIssue } = await github.rest.issues.get({ owner, repo, issue_number: n })
                for (const l of linkedIssue.labels) {
                  const name = typeof l === 'string' ? l : l.name
                  if (/^(area|priority):/.test(name)) labels.add(name)
                }
              } catch {}
            }

            // 저장소에 없는 라벨은 붙이지 않는다(새로 만들어지면 라벨 목록이 지저분해진다)
            const existing = new Set((await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 })).map(l => l.name))
            const toAdd = [...labels].filter(l => existing.has(l))
            // 붙이기만 하고 떼지 않는다 — 사람이 직접 붙인 라벨을 지우지 않기 위해
            if (toAdd.length) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd })

            // ── 5. auto-merge 예약 ───────────────────────────────
            // 승인·필수 검사·코멘트 해결이 다 되면 GitHub이 바로 병합한다(병합 커밋 방식).
            // 안전장치:
            //  - 기본 브랜치(dev)로 가는 PR만. 배포 PR(→ main)은 반영 시점을 사람이 고르고,
            //    스택 PR(base가 다른 작업 브랜치)은 dev가 아닌 곳으로 병합돼 버린다
            //  - 대상 브랜치에 필수 상태 검사가 걸려 있을 때만. 없으면 승인 하나로 CI 실패 코드가 들어간다
            //  - Draft, no-auto-merge 라벨이면 켜지 않고, 라벨이 붙으면 이미 켠 예약도 끈다
            const prLabels = new Set([...(pr.labels ?? []).map(l => l.name), ...toAdd])
            const optOut = prLabels.has('no-auto-merge')
            let autoMerge = '해당 없음'
            if (optOut && pr.auto_merge) {
              await github.graphql(`mutation($id: ID!) { disablePullRequestAutoMerge(input: { pullRequestId: $id }) { clientMutationId } }`, { id: pr.node_id })
              autoMerge = '해제(no-auto-merge 라벨)'
            } else if (isFirstSetup && !pr.draft && !optOut && !pr.auto_merge && pr.base.ref === context.payload.repository.default_branch) {
              const { data: rules } = await github.rest.repos.getBranchRules({ owner, repo, branch: pr.base.ref })
              if (!rules.some(r => r.type === 'required_status_checks')) {
                autoMerge = `건너뜀 — ${pr.base.ref}에 필수 검사가 없음`
              } else {
                try {
                  await github.graphql(`mutation($id: ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: MERGE }) { clientMutationId } }`, { id: pr.node_id })
                  autoMerge = '예약함(병합 커밋)'
                } catch (e) {
                  // 이미 병합 가능한 상태(clean)면 예약할 수 없다고 에러가 난다 — 실패로 보지 않는다
                  autoMerge = `예약 못 함: ${e.message}`
                }
              }
            }

            core.summary
              .addHeading(`PR #${issue_number} 자동 설정`)
              .addList([
                `담당자: ${isBot ? '(봇 PR — 건너뜀)' : author}`,
                `관련 이슈: ${linked.length ? linked.map(n => '#' + n).join(', ') : '없음'}`,
                `라벨: ${toAdd.join(', ') || '없음'}`,
                `auto-merge: ${autoMerge}`,
              ])
            await core.summary.write()

      # ── 5. 프로젝트 ───────────────────────────────────────────
      # 조직 프로젝트(Projects v2)는 기본 토큰(GITHUB_TOKEN)으로 접근할 수 없어 별도 토큰이 필요하다.
      # 저장소 변수 PROJECT_URL(https://github.com/orgs/badak-tier-park/projects/6)과 project 쓰기 권한
      # 토큰 시크릿 PROJECT_TOKEN을 둘 다 설정했을 때만 켠다. 토큰 없이 켜면 모든 PR에서 이 단계가 실패한다.
      # 프로젝트 설정의 내장 "Auto-add to project" 워크플로를 켜면 이 단계 없이도 된다
      - name: 프로젝트에 추가
        if: vars.PROJECT_URL != '' && github.event.action == 'opened'
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}
