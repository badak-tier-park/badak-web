version: 2
updates:
  # 작업 브랜치와 같은 흐름(dev → main)으로 들어오게 dev를 대상으로 한다
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels: ["area:infra"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # 자잘한 업데이트 PR이 수십 개 쌓이지 않게 minor/patch는 한 PR로 묶는다
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7(Go 포팅)은 JS 컴파일러(lib/tsc)가 없어 vue-tsc가 실행되지 않는다(#150).
      # vue-tsc가 TS 7을 지원하면 이 항목을 지운다
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: ["area:infra"]
    commit-message:
      prefix: chore
